<style>
:root{--gold:#d4af37;--cream:#f6ecd2;--a:#d4af37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#07060b;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 0%,color-mix(in srgb,var(--a) 30%,transparent),transparent 70%),radial-gradient(ellipse at 50% 120%,#1a1026,transparent 60%);transition:opacity 1s}
body::after{content:"";position:fixed;inset:0;box-shadow:inset 0 0 160px #000;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none}
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 10px}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:'Cinzel',Georgia,serif;font-weight:700;letter-spacing:.3em;font-size:12px;color:var(--gold);text-transform:uppercase}
.brand i{font-style:normal;opacity:.7;margin-right:8px}
.pill{font:600 11px 'Cinzel',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.35);padding:8px 14px;border-radius:99px;cursor:pointer;transition:.25s}
.pill:hover{background:rgba(212,175,55,.18)}
.pill.solid{background:var(--gold);color:#140e04;border-color:var(--gold)}
.tools{display:flex;gap:8px}
main{flex:1;width:100%;max-width:520px;position:relative;display:flex;align-items:center;justify-content:center}
.screen{display:none;flex-direction:column;align-items:center;text-align:center;width:100%;gap:14px;animation:in .8s both}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.eyebrow{font:italic 500 19px 'Cormorant Garamond',serif;color:rgba(212,175,55,.85);letter-spacing:.14em;margin:0}
h1{font-family:'Cinzel',Georgia,serif;font-weight:900;text-transform:uppercase;letter-spacing:.14em;margin:0;line-height:1.1}
.title{font-size:clamp(28px,7vw,46px);background:linear-gradient(180deg,#fff6d8,#d4af37 60%,#8a6a16);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:clamp(17px,4.4vw,20px);font-style:italic;color:rgba(246,236,210,.8);max-width:400px;margin:0;line-height:1.35}
.hatwrap{width:min(62vw,250px);animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 28px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(212,175,55,.25))}
.hatwrap.sm{width:min(40vw,190px)}
@keyframes float{50%{transform:translateY(-10px) rotate(1.2deg)}}
.hatwrap svg{width:100%;height:auto;display:block;overflow:visible}
.mouth{transform-box:fill-box;transform-origin:50% 0}
.talk .mouth{animation:mouth .26s ease-in-out infinite alternate}
.talk .hat-body{animation:jaw .26s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes mouth{to{transform:scaleY(.3)}}
@keyframes jaw{to{transform:scale(1.012,.988)}}
.field{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid rgba(212,175,55,.4);color:var(--cream);text-align:center;font:600 20px 'Cormorant Garamond',serif;outline:none;transition:.25s}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.field::placeholder{color:rgba(212,175,55,.45);font-style:italic}
.cta{font:700 13px 'Cinzel',Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:#140e04;background:linear-gradient(180deg,#f3d77a,#c9a227);border:0;padding:16px 36px;border-radius:99px;cursor:pointer;box-shadow:0 0 0 1px #fff3 inset,0 10px 30px rgba(212,175,55,.3);transition:.3s}
.cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px #fff4 inset,0 14px 40px rgba(212,175,55,.55)}
.cta:disabled{opacity:.5;pointer-events:none}
.ghost{font:600 11px 'Cinzel',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.4);padding:13px 18px;border-radius:12px;cursor:pointer;transition:.25s}
.ghost:hover{background:rgba(212,175,55,.16)}
.who{font:600 11px 'Cinzel',Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,175,55,.75);margin:0}
.who b{color:#fff}
.mood{font:italic 600 15px 'Cormorant Garamond',serif;color:rgba(212,175,55,.8);margin:-4px 0 0;min-height:20px}
.bubble{position:relative;width:100%;min-height:118px;padding:22px 24px;border-radius:20px;background:linear-gradient(180deg,rgba(28,22,40,.92),rgba(10,8,16,.92));border:1px solid rgba(212,175,55,.45);box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.bubble::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;background:#1c1628;border-left:1px solid rgba(212,175,55,.45);border-top:1px solid rgba(212,175,55,.45);transform:translateX(-50%) rotate(45deg)}
.bubble p{margin:0;font:italic 600 clamp(20px,5vw,25px) 'Cormorant Garamond',serif;line-height:1.3}
.crestwrap{width:min(46vw,190px);animation:pop 1.1s cubic-bezier(.1,.8,.2,1) both;filter:drop-shadow(0 0 30px var(--a)) drop-shadow(0 14px 20px rgba(0,0,0,.6))}
.crestwrap svg{width:100%;display:block}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-10deg)}60%{transform:scale(1.07) rotate(2deg);opacity:1}100%{transform:none}}
.hname{font-size:clamp(38px,11vw,68px);color:var(--a);text-shadow:0 0 30px color-mix(in srgb,var(--a) 70%,transparent),0 2px 0 #000;animation:in 1s .35s both}
.traits{font:700 13px 'Cinzel',Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0;animation:in 1s .55s both}
.verdict{margin:0;max-width:380px;font-size:clamp(17px,4.4vw,20px);font-style:italic;color:rgba(246,236,210,.85);line-height:1.35;animation:in 1s .75s both}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;animation:in 1s .95s both}
footer{font:500 11px 'Cinzel',Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,175,55,.4);padding-top:8px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.scroll{width:100%;max-width:480px;max-height:86vh;display:flex;flex-direction:column;border-radius:18px;padding:22px;background:linear-gradient(180deg,#191322,#0a0810);border:1px solid rgba(212,175,55,.5);box-shadow:0 30px 80px #000}
.scroll h2{font:700 17px 'Cinzel',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.scroll small{font-style:italic;color:rgba(246,236,210,.65);font-size:15px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tally div{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tally svg{width:30px}.tally b{font:700 16px 'Cinzel',serif;color:var(--cream)}
#list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px;padding-right:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.18)}
.row svg{width:26px;flex:none}.row b{font:700 14px 'Cinzel',serif;color:var(--cream);display:block;word-break:break-word}
.row span{font-style:italic;font-size:15px}.row time{margin-left:auto;font:12px monospace;color:rgba(212,175,55,.5)}
.empty{text-align:center;font-style:italic;color:rgba(212,175,55,.55);padding:22px 0}
.mfoot{display:flex;justify-content:space-between;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:30;background:var(--gold);color:#140e04;font:700 12px 'Cinzel',serif;letter-spacing:.14em;text-transform:uppercase;padding:12px 20px;border-radius:99px;transition:.35s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-height:700px){.hatwrap{width:min(46vw,190px)}.screen{gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
body::before{z-index:1;background:radial-gradient(ellipse 75% 50% at 50% 0%,color-mix(in srgb,var(--a) 26%,transparent),transparent 70%),linear-gradient(180deg,rgba(6,5,12,.38),rgba(6,5,12,.9))}
body::after{z-index:3}
#fx{z-index:2}
.app{overflow-y:auto}
header{flex-wrap:wrap}
.brand{letter-spacing:.34em}
.pill{border-radius:3px;padding:8px 12px;letter-spacing:.14em}
.cta,.ghost{border-radius:3px}
.cta{background:var(--gold);box-shadow:none;letter-spacing:.22em}
.cta:hover{background:#f0d27a;box-shadow:0 0 28px rgba(212,175,55,.45)}
.field{border-radius:3px;background:rgba(0,0,0,.55)}
main{padding:10px 0}
.screen{padding:26px 20px;background:rgba(7,5,12,.6);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(212,175,55,.3);border-radius:4px;box-shadow:0 0 0 5px rgba(0,0,0,.25),0 30px 70px rgba(0,0,0,.6)}
.title{background:none;color:var(--cream);-webkit-text-fill-color:currentColor;font-size:clamp(26px,6.4vw,40px);letter-spacing:.18em;text-shadow:0 2px 0 #000,0 0 24px rgba(212,175,55,.35)}
.bubble{border-radius:4px}
.crestwrap{width:min(60vw,250px)}
.crestwrap img{width:100%;display:block}
.tally img{width:34px;height:40px;object-fit:contain}
.row img{width:30px;height:36px;object-fit:contain;flex:none}
.row,.tally div,.scroll{border-radius:4px}
@media(max-width:480px){.pill{padding:7px 9px;font-size:10px}.brand{font-size:11px}}
.candles{position:fixed;inset:0;z-index:1;pointer-events:none}.candle{position:absolute;width:9px;height:34px;border-radius:2px;background:linear-gradient(90deg,#d9cfae,#f6efd6 50%,#c8bd98);opacity:.85;animation:bob var(--d) ease-in-out infinite alternate}.candle::before{content:"";position:absolute;left:50%;top:-17px;width:10px;height:18px;margin-left:-5px;border-radius:50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff7c2,#ffb938 55%,transparent 72%);box-shadow:0 0 18px 6px rgba(255,190,70,.45);animation:flick .16s infinite alternate}@keyframes bob{to{transform:translateY(-14px)}}@keyframes flick{to{transform:scale(.88,1.1);opacity:.85}}
/* ---- big responsive stage ---- */
.app{padding:clamp(8px,1.6vh,18px) clamp(8px,2vw,24px)}
header{max-width:min(94vw,1400px)}
.brand{font-size:clamp(11px,1.5vw,16px)}
.pill{font-size:clamp(10px,1.2vw,13px);padding:clamp(7px,1vh,11px) clamp(9px,1.4vw,18px)}
main{max-width:min(75vw,1300px);min-height:0;padding:clamp(6px,1.2vh,14px) 0}
.screen{min-height:75vh;max-height:100%;justify-content:center;gap:clamp(10px,2vh,26px);padding:clamp(18px,4vh,48px) clamp(16px,4vw,64px);overflow-y:auto}
.eyebrow{font-size:clamp(18px,2.4vw,30px)}
.title{font-size:clamp(28px,5vw,68px)}
.lede{font-size:clamp(18px,2.4vw,30px);max-width:min(760px,90%)}
.hatwrap,.hatwrap.sm{width:min(36vh,52vw,420px)}
.who{font-size:clamp(11px,1.4vw,17px)}
.mood{font-size:clamp(16px,2vw,26px);min-height:1.4em}
.bubble{max-width:min(900px,100%);min-height:clamp(120px,20vh,220px);padding:clamp(20px,3.5vh,44px) clamp(20px,3.5vw,52px)}
.bubble p{font-size:clamp(22px,3.2vw,46px)}
.field{max-width:min(520px,90%);font-size:clamp(20px,2.4vw,32px);padding:clamp(14px,2vh,22px) 20px}
.cta{font-size:clamp(13px,1.5vw,19px);padding:clamp(16px,2.2vh,24px) clamp(34px,5vw,64px)}
.ghost{font-size:clamp(11px,1.3vw,16px);padding:clamp(13px,1.8vh,20px) clamp(18px,2.4vw,30px)}
.opts,.actions{gap:clamp(10px,1.4vw,18px)}
.crestwrap{width:min(34vh,50vw,360px)}
.hname{font-size:clamp(42px,8vw,120px)}
.traits{font-size:clamp(13px,1.7vw,22px)}
.verdict{font-size:clamp(19px,2.5vw,32px);max-width:min(800px,92%)}
.scroll{max-width:min(720px,94vw)}
@media(max-width:700px){main{max-width:96vw}.screen{min-height:80vh}.hatwrap,.hatwrap.sm{width:min(30vh,60vw)}}
@media(max-height:560px){.screen{min-height:0}.hatwrap,.hatwrap.sm{width:min(26vh,34vw)}}
#add{font-size:clamp(12px,1.4vw,17px)!important;padding:clamp(14px,2vh,22px) clamp(24px,3vw,40px)!important}
.app{padding-top:clamp(10px,2vh,24px)}
header{max-width:min(96vw,1500px);gap:clamp(10px,1.6vw,24px)}
.brand{font-size:clamp(17px,2.7vw,36px);letter-spacing:.2em;text-shadow:0 2px 14px rgba(212,175,55,.35)}
.tools{gap:clamp(8px,1.2vw,16px);flex-wrap:wrap}
.pill{font-size:clamp(13px,1.7vw,21px);padding:clamp(11px,1.6vh,17px) clamp(16px,2.2vw,32px);letter-spacing:.12em;border-width:2px}
footer{font-size:clamp(12px,1.4vw,18px);padding:clamp(6px,1.2vh,14px) 0}
/* ---- fit any window without scrolling; centred header ---- */
header{justify-content:center;flex-wrap:wrap;text-align:center}
.tools{justify-content:center}
.screen{overflow-y:visible;max-height:none;min-height:0;gap:clamp(6px,1.6vh,22px);padding:clamp(12px,3vh,40px) clamp(16px,4vw,64px)}

</head>
<body>
<div id="bg"></div>
<div class="candles" id="candles"></div><canvas id="fx"></canvas>
<div class="app">
<header>
  <div class="brand">Meta Coders Club</div>
  <div class="tools">
    <button class="pill" id="mute" aria-label="Toggle voice">Voice on</button>
    <button class="pill" id="music" aria-label="Toggle music">Music off</button>
    <button class="pill" id="resetBtn" title="Restart the draw: 30 students, 5 per house">Reset · <span id="sortedCnt">0</span>/30</button>
    <button class="pill solid" id="wallBtn">Story Wall · <span id="cnt">0</span></button>
  </div>
</header>

<main>
  <section class="screen on" id="s-intro">
    <p class="eyebrow">Meta Coders Club presents</p>
    <div class="hatwrap" id="hat0"></div>
    <h1 class="title">The Sorting Ceremony</h1>
    <p class="lede">Place the hat upon your head, tell it your name, and let it peer into your mind.</p>
    <input class="field" id="name" maxlength="24" placeholder="Your name, brave soul…" autocomplete="off">
    <div class="actions" style="margin-top:0">
      <button class="cta" id="go">Put On The Hat</button>
      <button class="ghost" id="skipBtn" title="Skip the hat's story and reveal the house straight away">Skip Story · Reveal Now</button>
    </div>
  </section>

  <section class="screen" id="s-think">
    <div class="hatwrap sm" id="hat1"></div>
    <p class="who">Reading the mind of <b id="who"></b></p>
    <p class="mood" id="mood"></p>
    <div class="bubble"><p id="say"></p></div>
  </section>

  <section class="screen" id="s-res">
    <div class="crestwrap" id="crest"></div>
    <p class="eyebrow">Better be…</p>
    <h1 class="hname" id="hname"></h1>
    <p class="traits" id="traits"></p>
    <p class="verdict" id="verdict"></p>
    <div class="actions">
      <button class="ghost" id="copy">Copy Story Caption</button>
      <button class="ghost" id="next">Next Student</button>
    </div>
  </section>
</main>
<footer id="foot"></footer>
</div>

<div class="modal" id="modal"><div class="scroll">
  <h2>House Chronicles</h2><small>Everyone sorted tonight, and where they landed.</small>
  <div class="tally" id="tally"></div>
  <div id="list"></div>
  <div class="mfoot"><button class="ghost" id="clear">Clear Wall</button><button class="ghost" id="close">Close Scroll</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const CLUB = 'Meta Coders Club';
const $ = id => document.getElementById(id);

/* ---------- Sorting Hat (inline SVG, no external images) ---------- */
const HAT = `<svg viewBox="0 0 240 250" aria-label="The Sorting Hat">
<defs>
<linearGradient id="hb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5636"/><stop offset=".55" stop-color="#4a3221"/><stop offset="1" stop-color="#241509"/></linearGradient>
<linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e4329"/><stop offset="1" stop-color="#1e1208"/></linearGradient>
</defs>
<ellipse cx="120" cy="228" rx="108" ry="18" fill="#000" opacity=".35"/>
<g class="hat-body">

<path d="M40 204C54 150 82 112 102 72C114 44 138 24 178 17C196 14 208 30 190 39C168 50 164 68 172 98C182 134 194 170 200 204C160 222 80 222 40 204Z" fill="url(#hb)"/>
<path d="M60 175C80 185 160 185 184 172M72 140C96 150 150 150 172 138M88 105C104 112 140 112 160 104" fill="none" stroke="#2a190c" stroke-width="3" opacity=".7" stroke-linecap="round"/>
<path d="M102 72C112 82 132 84 150 76" fill="none" stroke="#2a190c" stroke-width="2.5" opacity=".6"/>
<path d="M60 160L66 168M74 150L79 160M164 150L170 158" stroke="#c9a66b" stroke-width="2" stroke-dasharray="3 4" opacity=".55"/>
<path d="M62 192C86 204 154 204 182 190" fill="none" stroke="#c9a66b" stroke-width="2" stroke-dasharray="4 5" opacity=".6"/>
<path d="M72 138c10-14 24-14 34 0c-10-6-24-6-34 0zM134 138c10-14 24-14 34 0c-10-6-24-6-34 0z" fill="#20130a"/>
<ellipse cx="89" cy="141" rx="6" ry="4" fill="#f6ecd2" opacity=".9"/><ellipse cx="151" cy="141" rx="6" ry="4" fill="#f6ecd2" opacity=".9"/>
<circle cx="90" cy="141" r="2.4" fill="#120a04"/><circle cx="152" cy="141" r="2.4" fill="#120a04"/>
<path d="M74 122c12-8 22-8 30-2M136 120c8-6 18-6 30 2" fill="none" stroke="#20130a" stroke-width="4" stroke-linecap="round"/>
<path d="M118 146c-4 10-6 16 2 18" fill="none" stroke="#2a190c" stroke-width="3" stroke-linecap="round"/>
<path class="mouth" d="M84 172Q121 162 160 172Q124 204 84 172Z" fill="#100702" stroke="#6b4a2a" stroke-width="2"/>
<path d="M60 70c8 10 22 16 40 14" fill="none" stroke="#a9845a" stroke-width="2" opacity=".25"/>
</g></svg>`;
$('hat0').innerHTML = HAT;
$('hat1').innerHTML = HAT.replace(/id="hb"|id="br"|url\(#hb\)|url\(#br\)/g, m => m.replace('hb','hb2').replace('br','br2'));

/* ---------- Houses & crests (inline SVG) ---------- */
const houses = [
 {id:'gryffindor',name:'Gryffindor',glow:'#e5484d',c1:'#8e1b1b',c3:'#4c0c0c',c2:'#e3b93c',traits:'Courage · Daring · Nerve',
  verdicts:['A lionhearted pick if ever I saw one. Charge in, and never look back!','Bold, brash and a little reckless. Gryffindor will suit you splendidly.','Such fire! Brave souls like you are born for Gryffindor.'],
  em:`<circle cx="50" cy="56" r="28" fill="none" stroke-width="9" stroke-dasharray="6 4"/><circle cx="50" cy="56" r="21"/><circle cx="33" cy="38" r="6"/><circle cx="67" cy="38" r="6"/><circle cx="43" cy="52" r="2.6" fill="var(--k)" stroke="none"/><circle cx="57" cy="52" r="2.6" fill="var(--k)" stroke="none"/><path d="M45 61h10l-5 7z" fill="var(--k)" stroke="none"/><path d="M50 68v3M43 73q7 5 14 0" fill="none" stroke="var(--k)" stroke-width="1.8"/>`},
 {id:'slytherin',name:'Slytherin',glow:'#37c77f',c1:'#1c6a43',c3:'#0b301f',c2:'#d3dadc',traits:'Ambition · Cunning · Resolve',
  verdicts:['Clever, driven, and hungry for greatness. Slytherin it is!','I see ambition, and a sharp mind to match. You will go far in Slytherin.','Cunning and quietly formidable. Slytherin will sharpen you.'],
  em:`<path d="M36 32C68 30 70 52 44 57C22 61 26 82 52 84C72 86 74 97 62 102" fill="none" stroke-width="8" stroke-linecap="round"/><circle cx="35" cy="32" r="8"/><circle cx="32" cy="30" r="1.8" fill="var(--k)" stroke="none"/><path d="M27 37l-7 3m7-3l-6-6" fill="none" stroke-width="1.6"/>`},
 {id:'ravenclaw',name:'Ravenclaw',glow:'#5a8cf0',c1:'#1c3f93',c3:'#0b1e56',c2:'#cb9156',traits:'Wisdom · Wit · Curiosity',
  verdicts:['A sharp, searching mind, and Ravenclaw prizes exactly that.','Curious to your core. Ravenclaw will keep you wonderfully busy.','Wit beyond measure indeed. Ravenclaw welcomes you!'],
  em:`<g id="w"><path d="M49 52C38 38 24 36 15 42C23 44 26 52 21 60C29 56 34 62 32 70C40 64 46 68 49 80Z" stroke="none"/></g><g transform="translate(100 0) scale(-1 1)"><path d="M49 52C38 38 24 36 15 42C23 44 26 52 21 60C29 56 34 62 32 70C40 64 46 68 49 80Z" stroke="none"/></g><path d="M50 40l7 12-7 44-7-44z" stroke="none"/><circle cx="50" cy="36" r="7" stroke="none"/><path d="M57 35l8 3-8 3z" stroke="none"/><circle cx="52" cy="34" r="1.5" fill="var(--k)" stroke="none"/>`},
 {id:'hufflepuff',name:'Hufflepuff',glow:'#f5cb34',c1:'#f0c419',c3:'#c69a0a',c2:'#1b1b1b',traits:'Loyalty · Patience · Fair Play',
  verdicts:['Loyal to the bone, and that is rarer than any talent. Hufflepuff!','Kind, steady and tireless. Hufflepuff is lucky to have you.','Hard work and a good heart. A proud Hufflepuff at last!'],
  em:`<path d="M50 32C68 32 78 46 76 62C74 82 62 92 50 92C38 92 26 82 24 62C22 46 32 32 50 32Z" stroke="none"/><circle cx="32" cy="36" r="7" stroke="none"/><circle cx="68" cy="36" r="7" stroke="none"/><path d="M45 33l-4 44M55 33l4 44" stroke="var(--k)" stroke-width="7" fill="none"/><circle cx="40" cy="64" r="2.6" fill="var(--k)" stroke="none"/><circle cx="60" cy="64" r="2.6" fill="var(--k)" stroke="none"/><ellipse cx="50" cy="82" rx="6" ry="4" fill="var(--k)" stroke="none"/>`}
,
 {id:'moonvale',name:'Moonvale',glow:'#8fb4ff',traits:'Intuition · Loyalty · Night Vision',
  verdicts:['A quiet howl in the dark, and a pack that will follow it. Moonvale!','Calm, perceptive and fiercely loyal. Moonvale has been waiting for you.','You see what others miss beneath the moonlight. Moonvale it is!']},
 {id:'flamel',name:'Flamel',glow:'#ff7a45',traits:'Rebirth · Brilliance · Fire',
  verdicts:['A phoenix spirit if ever I saw one. Rise, Flamel!','Bright, daring and impossible to keep down. Flamel suits you.','Your spark could light the whole hall. Welcome to Flamel!']}
];
const crest = h => `<img src="crests/${h.id}.webp" alt="${h.name} crest">`;

/* ---------- Fixed draw: 30 students, 6 houses, exactly 5 each, random order ---------- */
const PER_HOUSE = 5, TOTAL = PER_HOUSE * houses.length;
function freshBag() {
  const b = houses.flatMap(h => Array(PER_HOUSE).fill(h.id));
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
const freshOrder = () => { const o = Array.from({length: TOTAL}, (_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
let bag, porder;
try { bag = JSON.parse(localStorage.getItem('sorting_bag')); porder = JSON.parse(localStorage.getItem('sorting_porder')); } catch (e) {}
if (!Array.isArray(porder) || porder.length !== TOTAL) porder = freshOrder();
if (!Array.isArray(bag) || bag.length > TOTAL || bag.some(id => !houses.some(h => h.id === id))) bag = freshBag();
const saveBag = () => { try { localStorage.setItem('sorting_bag', JSON.stringify(bag)); localStorage.setItem('sorting_porder', JSON.stringify(porder)); } catch (e) {} const f = $('foot'); if (f) f.textContent = `${CLUB} · Sorting Ceremony · ${TOTAL - bag.length}/${TOTAL} sorted`; const sc = $('sortedCnt'); if (sc) sc.textContent = TOTAL - bag.length; };
const drawHouse = () => { const id = bag.pop(); saveBag(); return houses.find(h => h.id === id); };

/* ---------- The Hat's voices: each line has a mood that changes how it speaks ---------- */
const moods = {Wise:[.8,.85], Dramatic:[.6,.8], Playful:[1.1,1], Mysterious:[.5,.75], Grumpy:[.45,.85], Sleepy:[.7,.65], Excited:[1.2,1.05]};
const lines = [["Wise", "Hmm, {n}… a restless mind, brave yet careful. Yes, I know just the place for you."], ["Excited", "Ooh, {n}! What a spark you carry. I have not felt one like it in years!"], ["Mysterious", "{n}… I see what you truly want, and what you hide. Interesting, very interesting."], ["Playful", "Well, hello {n}! Sit still now. Let me rummage around up here."], ["Dramatic", "Oh, {n}! Courage and cunning, tangled together. What agony of choice!"], ["Grumpy", "Another one! Stop thinking so loudly, {n}. I am trying to concentrate."], ["Sleepy", "Mmm… oh, hello {n}. I was napping. Now, what have we here?"], ["Wise", "A curious heart, {n}, and a stubborn streak. Yes, that tells me plenty."], ["Excited", "Wait, wait! {n}, you are not like the others. Hold tight, I know where you belong!"], ["Dramatic", "Brilliance, loyalty, fire… {n}, you have a little of everything. Let me think!"], ["Mysterious", "I have sorted a thousand heads, {n}, but yours hums with something strange."], ["Playful", "Ha! {n}, you thought I would not notice that secret. I notice everything."], ["Grumpy", "Hurry? I have been sorting since before your grandparents, {n}. Patience!"], ["Sleepy", "Yes… no… yes. Do not rush me, {n}. I am nearly there."], ["Wise", "{n}, you listen more than you speak. That is rarer than any talent."], ["Excited", "Marvellous! {n}, there is real ambition in here. I can almost taste it!"], ["Dramatic", "Great heavens, {n}! This is the hardest choice I have faced all night."], ["Mysterious", "Shh, {n}. I hear a quiet voice in your head, and it is brave."], ["Playful", "Ooh, {n}, you are fun! Bright ideas and a very mischievous streak."], ["Grumpy", "Hmph. {n}, you fidget far too much. Still… a decent mind in there."], ["Wise", "Kind, clever and a bit proud, {n}. Yes, I begin to see where you fit."], ["Sleepy", "Ahh, {n}… dreams of glory, I see. Let me wake up properly and decide."], ["Excited", "Oh, {n}! I can feel your heart racing. Good. That means you care."], ["Dramatic", "{n}! A bold soul indeed. The hat has not shivered like this in ages."], ["Mysterious", "Ah, {n}… the moon and the flame both pull at you. Curious indeed."], ["Playful", "Now then, {n}, let us see. Wit, yes. Courage, yes. Cheek, definitely!"], ["Grumpy", "Sit up straight, {n}. Hmm… yes, grudgingly, I like what I find."], ["Wise", "Patience and daring, {n}, in nearly equal measure. That is a dangerous mix."], ["Excited", "Splendid, {n}! You have a mind full of ideas. Let me match it to a home!"], ["Dramatic", "Behold, {n}! A future builder, dreamer and troublemaker. I know your house now!"]];

/* ---------- Voice + typing ---------- */
let muted = false, voices = [], cur = null, added = false;
const pickVoices = () => voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : [];
if ('speechSynthesis' in window) { pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
const wait = ms => new Promise(r => setTimeout(r, ms));
const hats = () => document.querySelectorAll('.hatwrap');
const talk = on => { hats().forEach(h => h.classList.toggle('talk', on)); if (master) master.gain.setTargetAtTime(on ? .03 : .1, ac.currentTime, .15); };

let vac, vmode='voice';
const vctx=()=>{try{vac=vac||new (window.AudioContext||window.webkitAudioContext)();if(vac.state==='suspended')vac.resume();return vac}catch(e){return null}};
function vtone(f,t0,d,type,g){const c=vac,o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(0,t0);a.gain.linearRampToValueAtTime(g,t0+.03);a.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(a);a.connect(c.destination);o.start(t0);o.stop(t0+d+.05)}
function chime(){if(muted||!vctx())return;const t=vac.currentTime;[523,659,784,1047].forEach((f,i)=>vtone(f,t+i*.11,.9,'sine',.14))}
/* Built-in hat voice: letter-by-letter vowel formants. Works on every device, no speech engine needed. */
const FORM=[[800,1200],[500,1900],[300,2300],[500,900],[350,700],[450,1500]];
function mumble(text,[pitch,rate]){
  if(!vctx())return 0;
  const c=vac,t0=c.currentTime+.03,base=65+pitch*55;let t=t0;
  for(const ch of text.toLowerCase()){
    const v='aeiou'.indexOf(ch);
    if(!/[a-z]/.test(ch)){t+=.09/rate;continue}
    const d=(v>=0?.12:.06)/rate,f=FORM[v>=0?v:5];
    const o=c.createOscillator(),g=c.createGain(),b1=c.createBiquadFilter(),b2=c.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(base*(.85+((ch.charCodeAt(0)*7)%10)/22),t);
    b1.type=b2.type='bandpass';b1.frequency.value=f[0];b2.frequency.value=f[1];b1.Q.value=b2.Q.value=4;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v>=0?1.6:.7,t+.02);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);
    t+=d*.9;
  }
  return (t-t0)*1000;
}
function bestVoice(){
  const sc=v=>(/natural|online/i.test(v.name)?50:0)+(/google uk english male/i.test(v.name)?40:0)+(/en[-_]GB/i.test(v.lang)?20:0)+(/male|daniel|george|ryan|arthur|oliver|james|guy|alfie|thomas/i.test(v.name)&&!/female/i.test(v.name)?15:0)+(/^en/i.test(v.lang)?5:0)-(/female|zira|hazel|susan|samantha|aria|jenny/i.test(v.name)?10:0);
  return voices.filter(v=>/^en/i.test(v.lang)).sort((x,y)=>sc(y)-sc(x))[0];
}
function speakSynth(text,[pitch,rate]){
  return new Promise(res=>{
    let started=false,fin=false,fb,wd;
    const done=()=>{if(fin)return;fin=true;clearTimeout(fb);clearTimeout(wd);talk(false);res()};
    const synth=()=>{if(fin||started)return;started=true;talk(true);setTimeout(done,mumble(text,[pitch,rate])+250)};
    fb=setTimeout(done,text.length*130+6000);vctx();
    if(vmode==='off'){talk(true);setTimeout(done,text.length*55+700);return}
    if(vmode==='mumble'||!('speechSynthesis' in window)){synth();return}
    const u=new SpeechSynthesisUtterance(text);window.__hatU=u;
    const v=bestVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
    u.pitch=pitch;u.rate=rate;u.volume=1;
    u.onstart=()=>{started=true;clearTimeout(wd);talk(true)};
    u.onend=done;u.onerror=()=>started?done():synth();
    const go=()=>speechSynthesis.speak(u);
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,90)}else go();
    wd=setTimeout(()=>{if(!started){speechSynthesis.cancel();synth()}},1500);
  });
}
function speak(text,mood,maxMs){
  if(maxMs)mood=[mood[0],Math.min(1.35,Math.max(1.12,mood[1]+.25))];
  const p=speakSynth(text,mood);
  if(!maxMs)return p;
  return Promise.race([p,wait(maxMs).then(()=>{try{speechSynthesis.cancel()}catch(e){}talk(false)})]);
}
async function type(el, text) {
  el.textContent = '';
  const step = Math.max(18, Math.min(45, 4200 / text.length));
  for (const ch of text) { el.textContent += ch; await wait(step); }
}

/* ---------- Flow ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}
const cleanName = raw => {
  let n = (raw || '').normalize('NFC').replace(/[^\p{L}\p{N} .'\-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 24);
  if (n && (n === n.toLowerCase() || n === n.toUpperCase()))
    n = n.toLowerCase().replace(/(^|[ \-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  return n || 'Traveller';
};
async function begin(skip) {
  if (!bag.length) { toast(`All ${TOTAL} students are sorted. Press Reset to start over.`); return; }
  const name = cleanName($('name').value);
  if (skip === true) {
    cur = { name, house: drawHouse() }; added = false;
    if (!musicTouched) music(true);
    reveal(cur.house);
    return;
  }
  const [mood, tpl] = lines[porder[TOTAL - bag.length]];
  const text = tpl.replace(/\{n\}/g, name);
  cur = { name, house: null }; added = false;
  $('go').disabled = true;
  if (!musicTouched) music(true);
  $('who').textContent = name;
  show('s-think');
  $('mood').textContent = `The Hat is feeling ${mood.toLowerCase()}…`;
  $('say').style.opacity = 1;
  const t0 = Date.now();
  await Promise.all([type($('say'), text), speak(text, moods[mood], 6300)]);
  const h = drawHouse();
  cur.house = h;
  await wait(Math.max(0, 6800 - (Date.now() - t0)));
  reveal(h);
}
async function reveal(h) {
  document.body.style.setProperty('--a', h.glow);
  $('crest').innerHTML = crest(h);
  $('hname').textContent = h.name + '!';
  $('traits').textContent = h.traits;
  $('verdict').textContent = h.verdicts[Math.floor(Math.random() * h.verdicts.length)];
  addToWall();
  show('s-res');
  chime(); speak(`${cur.name}… better be… ${h.name}!`, moods.Dramatic, 3000);
}
function reset() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  talk(false);
  document.body.style.setProperty('--a', '#d4af37');
  $('name').value = ''; $('go').disabled = false;
  show('s-intro');
}

/* ---------- Story wall (saved in this browser) ---------- */
let wall = [];
try { wall = JSON.parse(localStorage.getItem('sorting_wall') || '[]'); } catch (e) {}
const save = () => { try { localStorage.setItem('sorting_wall', JSON.stringify(wall)); } catch (e) {} $('cnt').textContent = wall.length; };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => houses.find(h => h.id === id);
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }
function openWall() {
  $('tally').innerHTML = houses.map(h => `<div>${crest(h)}<b>${wall.filter(w => w.h === h.id).length}</b></div>`).join('');
  $('list').innerHTML = wall.length ? wall.map(w => { const h = byId(w.h); return `<div class="row">${crest(h)}<div><b>${esc(w.n)}</b><span style="color:${h.glow}">${h.name}</span></div><time>${w.t}</time></div>`; }).join('')
    : '<div class="empty">No one has been sorted yet. Be the first!</div>';
  $('modal').classList.add('on');
}
function addToWall() {
  if (added || !cur || !cur.house) return;
  added = true;
  wall.unshift({ n: cur.name, h: cur.house.id, t: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
  save(); toast('Added to the Story Wall');
}
$('copy').onclick = async () => {
  if (!cur || !cur.house) return;
  const t = `The Sorting Hat has spoken: I'm a ${cur.house.name}! ⚡ ${cur.house.traits.replace(/ · /g, ', ')}. Sorted at the ${CLUB} event.`;
  try { await navigator.clipboard.writeText(t); toast('Caption copied'); } catch (e) { toast('Copy not allowed here'); }
};
$('go').onclick = () => begin();
$('skipBtn').onclick = () => begin(true);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });
$('next').onclick = reset;
$('wallBtn').onclick = openWall;
$('close').onclick = () => $('modal').classList.remove('on');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('on'); };
$('resetBtn').onclick = () => {
  if ($('s-think').classList.contains('on')) { toast('Wait for the hat to finish'); return; }
  if (!confirm(`Reset the count?

This clears all ${TOTAL - bag.length} sorted students from the wall and restarts the draw: ${TOTAL} places, ${PER_HOUSE} per house.`)) return;
  wall = []; bag = freshBag(); porder = freshOrder(); save(); saveBag(); reset(); toast('Draw reset: 30 fresh places');
};
$('clear').onclick = () => { if (confirm('Clear the wall and restart the draw (30 fresh places, 5 per house)?')) { wall = []; bag = freshBag(); porder = freshOrder(); save(); saveBag(); openWall(); } };
$('mute').textContent = 'Voice: on';
$('mute').onclick = () => { vmode = vmode === 'off' ? 'voice' : 'off'; muted = vmode === 'off'; $('mute').textContent = muted ? 'Voice: off' : 'Voice: on'; if ('speechSynthesis' in window) speechSynthesis.cancel(); if (!muted) speak('Good evening, young wizard.', moods.Wise); };
$('music').onclick = () => { musicTouched = true; music(!musicOn); };
saveBag();
$('cnt').textContent = wall.length;


/* ---------- Ambient music: an original generative loop ---------- */
let ac, master, musicOn = false, musicTouched = false, mt, step = 0;
const SC = [220, 246.94, 261.63, 329.63, 392, 440, 493.88, 523.25];
function tone(f, t, d, type, v) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function music(on) {
  musicOn = on; $('music').textContent = on ? 'Music on' : 'Music off';
  clearInterval(mt);
  if (!on) { if (master) master.gain.setTargetAtTime(0, ac.currentTime, .2); return; }
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); const dl = ac.createDelay(); dl.delayTime.value = .45;
    const fb = ac.createGain(); fb.gain.value = .42; dl.connect(fb); fb.connect(dl);
    master.connect(ac.destination); master.connect(dl); dl.connect(ac.destination);
  }
  ac.resume(); master.gain.setTargetAtTime(.1, ac.currentTime, .3);
  const pat = [0, 3, 4, 5, 4, 3, 2, 3, 0, 2, 4, 6, 5, 4, 3, 1];
  mt = setInterval(() => {
    const t = ac.currentTime + .05;
    tone(SC[pat[step % 16]] * (step % 32 < 16 ? 1 : 1), t, 1.8, 'triangle', .5);
    if (step % 8 === 0) tone(step % 16 < 8 ? 110 : 98, t, 4, 'sine', .7);
    step++;
  }, 520);
}

/* ---------- Snow ---------- */
const cv = $('fx'), cx = cv.getContext('2d'); let W, H, P = [];
const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight;
  P = Array.from({length: Math.min(130, W * H / 9000 | 0)}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .5, v: Math.random() * .9 + .35, a: Math.random() * 6})); };
addEventListener('resize', resize); resize();
(function frame() {
  cx.clearRect(0, 0, W, H);
  for (const p of P) {
    p.y += p.v; p.x += Math.sin(p.y / 50 + p.a) * .45;
    if (p.y > H + 5) { p.y = -5; p.x = Math.random() * W; }
    cx.fillStyle = `rgba(255,255,255,${.35 + p.r / 5})`;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
  }
  requestAnimationFrame(frame);
})();
$('candles').innerHTML = Array.from({length: 9}, (_, i) => `<i class="candle" style="left:${6 + i * 10.5 + Math.random() * 4}%;top:${6 + Math.random() * 30}%;--d:${3 + Math.random() * 3}s;animation-delay:-${(Math.random() * 4).toFixed(1)}s"></i>`).join('');
</script>
